name: Build GridCraft APK

# Taruh file ini di: .github/workflows/build.yml (di repo GitHub kamu sendiri)
# Jalankan: tab Actions -> Build GridCraft APK -> Run workflow
# Hasil: Artifacts -> <app_name>-apk (berisi app-debug.apk)

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repo sumber GridCraft (isi fork kamu kalau sudah dimodifikasi mobile)"
        default: "storytold/gridcraft"
      ref:
        description: "Branch atau tag"
        default: "main"
      app_name:
        description: "Nama aplikasi"
        default: "GridCraft"
      app_id:
        description: "Package ID Android"
        default: "id.my.cames.gridcraft"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Ambil kode GridCraft
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          path: src

      - name: Pasang Rust + target WASM
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache build Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: Pasang trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build web (WASM, semua fitur)
        working-directory: src/apps/gridcraft-web
        run: trunk build --release --public-url ./

      - name: Cari folder hasil build
        id: dist
        run: |
          INDEX=$(find src -name index.html -path '*dist*' -not -path '*/node_modules/*' -not -path '*/target/*' | head -n1)
          test -n "$INDEX" || { echo "index.html hasil build tidak ditemukan"; exit 1; }
          echo "Ditemukan: $INDEX"
          echo "dir=$(dirname "$INDEX")" >> "$GITHUB_OUTPUT"

      - name: Pasang Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bungkus jadi proyek Android (Capacitor 6)
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_ID: ${{ inputs.app_id }}
          DIST: ${{ steps.dist.outputs.dir }}
        run: |
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          cp -r "$GITHUB_WORKSPACE/$DIST/." www/

          # Tampilan ramah HP: viewport, tanpa overscroll/bounce
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("www/index.html")
          h = p.read_text(encoding="utf-8")
          meta = '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'
          css = '<style>html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}</style>'
          h = re.sub(r'<meta[^>]*name=["\']viewport["\'][^>]*>', '', h)
          h = re.sub(r'<head[^>]*>', lambda m: m.group(0) + meta + css, h, count=1)
          p.write_text(h, encoding="utf-8")
          PY

          npx cap init "$APP_NAME" "$APP_ID" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
